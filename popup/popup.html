<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lan Brieft</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><img src="../icons/icon48.png" alt="" width="22" height="22" /><span>Lan Brieft</span></div>
  </header>

  <main class="panel">
    <div class="page-card">
      <div class="page-title" id="pageTitle">—</div>
      <div class="page-host" id="pageHost"></div>
    </div>

    <div id="status" class="status" hidden></div>

    <article id="result" class="result" hidden></article>

    <button class="btn primary block flex-center" id="btnOpenPanel" disabled>
      <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      <span>Mở bảng đầy đủ</span>
    </button>
    <p class="shortcut-line" id="shortcutLine" hidden></p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
